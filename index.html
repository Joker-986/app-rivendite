<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#033d6b" />
    <meta name="description" content="App gestionale per la ricerca e il tracciamento delle rivendite" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-196.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Ricerca Rivendite Tabacchi</title>
    
    <script>
      // Prevenzione overwrite window.fetch
      if (typeof window !== 'undefined' && window.fetch) {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => { console.warn('Attempted to overwrite window.fetch - ignored.'); },
            configurable: false
          });
        } catch (e) {
          console.warn('Could not lock window.fetch:', e);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('Service Worker registrato con successo con scope:', registration.scope);
            })
            .catch(error => {
              console.error('Registrazione del Service Worker fallita:', error);
            });
        });
      }
    </script>
  </body>
</html>
